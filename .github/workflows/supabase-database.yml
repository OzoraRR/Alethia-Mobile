name: Supabase database CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect database changes
    runs-on: ubuntu-24.04
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether database checks are needed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-changes-backend.sh

  database:
    name: Apply migrations and run pgTAP suite
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for Supabase CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm for API/Auth integration test
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.17.0

      - name: Install backend test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Reapply the full migration chain to a clean local database
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run username login against local Supabase Auth
        run: bash scripts/test-local-auth.sh

      - name: Rehearse a local database snapshot restore
        run: pnpm db:verify-restore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true

  required:
    name: Required database checks
    if: always()
    needs: [changes, database]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate required checks
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          DATABASE_CHANGED: ${{ needs.changes.outputs.database }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi
          if [[ "$DATABASE_CHANGED" == "true" && "$DATABASE_RESULT" != "success" ]]; then
            echo "Database verification did not succeed: $DATABASE_RESULT"
            exit 1
          fi
          echo "All required database checks succeeded or were not needed."
